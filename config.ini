# ============================================================
#  RTSP Monitor - Config File
#  Edit the settings below, then restart the program
# ============================================================

[camera]
# RTSP URL - supports multiple cameras (comma separated)
# Single:   rtsp://admin:password@192.168.1.100:554/stream
# Multiple: rtsp://admin:pass@192.168.1.100:554/stream, rtsp://admin:pass@192.168.1.101:554/stream
rtsp_urls = rtsp://username:password@192.168.1.100:554/stream

[detection]
# Model: yolov8n.pt (fastest) / yolov8s.pt / yolov8m.pt (most accurate)
model = yolov8n.pt

# Confidence threshold 0.0~1.0 (higher = fewer false alarms)
confidence = 0.50

# Detection frame rate (frames per second to analyze, lower = less CPU)
detect_fps = 5

[alert]
# Minimum seconds between popup alerts (prevents spam)
cooldown_seconds = 15

# Show live video window (True/False)
show_window = True

# Save alert screenshots (True/False)
save_screenshots = True

# Screenshot save folder
screenshot_dir = alerts

[notification]
# Windows popup notification (True/False)
windows_popup = True

# Popup display duration in seconds
popup_duration = 6

# WeCom (Enterprise WeChat) robot webhook URL (leave empty to disable)
wecom_webhook =

# DingTalk robot webhook URL (leave empty to disable)
dingtalk_webhook =

# Play sound on alert (True/False)
sound_alert = True
