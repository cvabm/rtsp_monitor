[camera]
rtsp_urls = rtsp://user:password@192.168.1.100:554/stream
# 多路用逗号分隔：
# rtsp://user:password@192.168.1.101:554/stream,rtsp://user:password@192.168.1.102:554/stream

[detection]
model = yolov8n.pt
confidence = 0.50
detect_fps = 5
region = 0.0000,0.0000,1.0000,1.0000

[alert]
cooldown_seconds = 15
show_window = True
save_screenshots = True
screenshot_dir = alerts

[notification]
windows_popup = True
popup_duration = 6
wecom_webhook = 
dingtalk_webhook = 
sound_alert = True

[recording]
enabled = True
record_dir = alerts
pre_seconds = 2
# 人离开后再录这么多秒；人还在画面里就一直录
post_seconds = 15
fps = 10
codec = mp4v

